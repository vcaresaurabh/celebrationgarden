 <div class="container">
        <header>
            <div class="header-container">
                <a href="#" class="logo">
                    <i class="fas fa-leaf logo-icon"></i>
                    Celebration Garden
                </a>
                
                <button class="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                
                <ul class="nav-menu">
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="AboutUs.html">About Us</a></li>
                    <li><a href="Venues.html">Venues</a></li>
                    <li><a href="Gallery.html">Gallery</a></li>
                    <li><a href="Menus.html">Menus</a></li>
                    <li><a href="Contact.html">Contact</a></li>
                </ul>
                
                <a href="#" class="cta-button">Schedule a Visit</a>
            </div>
        </header>
       
    </div>

    <script>
        // Mobile menu functionality
        document.querySelector('.mobile-menu-btn').addEventListener('click', function() {
            document.querySelector('.nav-menu').classList.toggle('active');
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const isClickInsideMenu = document.querySelector('.nav-menu').contains(event.target);
            const isClickOnMenuButton = document.querySelector('.mobile-menu-btn').contains(event.target);
            
            if (!isClickInsideMenu && !isClickOnMenuButton) {
                document.querySelector('.nav-menu').classList.remove('active');
            }
        });
        
        // Add scroll effect to header
        window.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.style.padding = '0.8rem 2rem';
                header.style.boxShadow = '0 4px 15px rgba(0, 0, 0, 0.1)';
            } else {
                header.style.padding = '1rem 2rem';
                header.style.boxShadow = '0 2px 20px rgba(0, 0, 0, 0.08)';
            }
        });
    </script>
